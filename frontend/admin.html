<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administración</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

<header>
    <h1>Panel de Administración</h1>
    <button id="boton-urls-fotos" type="button" aria-controls="urls-fotos-panel" aria-expanded="false" onclick="alternarEditorUrlsFotos()">
        Gestionar URLs de fotos
    </button>
</header>

<section id="urls-fotos-panel" hidden>
    <h2>URLs de las fotos de productos</h2>
    <p>Busca el plato en Unsplash, copia la dirección de la imagen y pégala aquí. También puedes usar el nombre de un archivo guardado en <code>frontend/img</code>.</p>
    <p id="mensaje-urls-fotos" role="status"></p>
    <div id="urls-fotos-productos"></div>
</section>

<section id="mantenimiento-categorias">
    <h2>Mantenimiento de categorías</h2>
    <div class="nueva-categoria">
        <input id="nueva-categoria-nombre" placeholder="Nombre de la categoría">
        <button onclick="crearCategoria()">Añadir categoría</button>
    </div>
    <p id="mensaje-categorias" role="status"></p>
    <div id="categorias-admin"></div>
</section>

<main id="admin"></main>

<section id="nuevo-producto">
    <h2>Añadir nuevo producto</h2>

    <label class="campo-admin">Producto
        <input id="nuevo-desc" placeholder="Nombre o descripción">
    </label>
    <label class="campo-admin">Precio total
        <input id="nuevo-precio" type="number" step="0.01" placeholder="Precio total">
    </label>
    <label class="campo-admin">Precio media ración
        <input id="nuevo-media" type="number" step="0.01" placeholder="Opcional">
    </label>
    <label class="campo-admin">Categoría
        <select id="nuevo-idcat"></select>
    </label>
    <label class="campo-admin">Foto
        <input id="nuevo-foto" placeholder="URL de la foto">
    </label>

    <button onclick="crearProducto()">Crear</button>
</section>

<script src="admin.js"></script>
</body>
</html>
