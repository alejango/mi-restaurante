<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #login-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            width: 300px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #0078ff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #005fcc;
        }
    </style>
</head>
<body>

<div id="login-box">
    <h2>Iniciar sesión</h2>

    <input id="user" placeholder="Usuario">
    <input id="pass" placeholder="Contraseña" type="password">

    <button onclick="login()">Entrar</button>

    <p id="msg" style="color:red;"></p>
</div>

<script>
function login() {
    const usuario = document.getElementById('user').value;
    const password = document.getElementById('pass').value;

    fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ usuario, password })
    })
    .then(res => res.json())
    .then(data => {
        if (data.token) {
            localStorage.setItem("token", data.token);
            window.location = "admin.html";
        } else {
            document.getElementById('msg').innerText = "Usuario o contraseña incorrectos";
        }
    });
}
</script>

</body>
</html>
